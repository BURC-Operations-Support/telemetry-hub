services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql

  dev:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - UV_PROJECT_ENVIRONMENT="/opt/venv"
    stdin_open: true
    tty: true
    command: ["bash", "-c", "uv sync --locked && exec sleep infinity"] # will add API startup command once architecture is confirmed


volumes:
  postgres_data: